[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-fingerprinter"
version = "0.3.0"
description = "Black-box LLM fingerprinting system for model identification"
readme = "readme.md"
license = {text = "MIT"}
authors = [
    {name = "litemars", email = "maxmassi12@gmail.com"},
]
requires-python = ">=3.9"
keywords = ["llm", "fingerprinting", "model-identification", "machine-learning", "nlp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "numpy>=1.21.0",
    "scikit-learn>=1.0.0",
    "scipy>=1.7.0",
    "sentence-transformers>=2.2.0",
    "nltk>=3.8.0",
    "requests>=2.28.0",
    "tenacity>=8.0.0",
    "click>=8.0.0",
    "joblib>=1.1.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0.0"]
gemini = ["google-genai>=0.1.0"]
all = [
    "openai>=1.0.0",
    "google-genai>=0.1.0",
    "httpx>=0.24.0",
]
dev = [
    "pytest>=7.0",
    "build",
    "twine",
]

[project.scripts]
llm-fingerprinter = "llm_fingerprinter.cli:cli"

[project.urls]
Homepage = "https://github.com/litemars/LLM-Fingerprinter"
Repository = "https://github.com/litemars/LLM-Fingerprinter"
Issues = "https://github.com/litemars/LLM-Fingerprinter/issues"

[tool.setuptools.packages.find]
include = ["llm_fingerprinter*"]

[tool.setuptools.package-data]
# Ship the pre-trained model inside the package so it travels with the wheel.
llm_fingerprinter = ["model/*.joblib"]
